<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logg inn - OAMS Admin</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Noto+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="admin.css">
</head>

<body>

  <div class="login-container">
    <div class="login-box">

      <img src="../assets/logo_svart.svg" alt="OAMS Logo" class="login-logo">

      <h1 class="login-title">OAMS Adminpanel</h1>

      <div id="loginAlert"
        style="display: none; padding: 12px; margin-bottom: 20px; border-radius: var(--radius-sm); font-size: 0.88rem; background-color: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; text-align: left;">
      </div>

      <form id="loginForm">
        <div class="form-group" style="text-align: left;">
          <label for="email">E-postadresse</label>
          <input type="email" id="email" class="form-control" required placeholder="admin@oams.no" autocomplete="email">
        </div>

        <div class="form-group" style="text-align: left;">
          <label for="password">Passord</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••"
            autocomplete="current-password">
        </div>

        <button type="submit" id="loginBtn" class="btn-admin btn-admin-primary"
          style="width: 100%; justify-content: center; padding: 12px; margin-top: 10px;">
          Logg inn
        </button>
      </form>

      <p style="margin-top: 24px; font-size: 0.82rem; color: #94a3b8;">
        Kun autoriserte administratorer har tilgang. <br>Nye brukere må inviteres av styret.
      </p>
    </div>
  </div>

  <script type="module" src="js/login.js"></script>
</body>

</html>
