<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 280" width="100%" height="100%">
  <defs>
    <style>
      .main-logo-text {
        font-family: "Gilroy-Bold", "Gilroy", "Metropolis", "Montserrat", "Avenir Next", "Avenir", sans-serif;
        font-weight: 700;
        font-size: 130px;
        fill: #141414;
      }
      .sub-logo-text {
        font-family: "Century Gothic", "ITC Avant Garde Gothic", "Montserrat", "Avenir", sans-serif;
        font-weight: 300;
        font-size: 18px;
        fill: #808080;
        letter-spacing: -0.2px;
      }
      .ekg-stroke {
        stroke: #d32025;
        stroke-width: 17;
        stroke-linecap: butt;
        stroke-linejoin: miter;
        stroke-miterlimit: 6;
        fill: none;
      }
    </style>
  </defs>

  <!-- Bakgrunnsbokstaver: O, M og S (plassert slik at A dannes av EKG-linjen) -->
  <text x="55" y="167" class="main-logo-text">O</text>
  <text x="270" y="167" class="main-logo-text" letter-spacing="-4">MS</text>

  <!-- Rød EKG-linje (Understrek + Puls/A + høyre understrek) -->
  <!-- Venstre kutt er vertikalt, høyre kutt har 45-graders skråskjæring -->
  <path class="ekg-stroke" d="
    M 56,190 
    L 155,190 
    L 175,205 
    L 218,60
    L 258,205 
    L 278,190 
    L 475,190 
  " />

  <!-- Skrå avslutning på høyre ende av EKG-linjen -->
  <polygon points="475,198.5 488,181.5 475,181.5" fill="#e31837" />
  <!-- Skrå avslutning på høyre ende av EKG-linjen -->
  <polygon points="55,181.5 43,198.5 75,198.5" fill="#e31837" />

  <!-- Undertittel i to linjer -->
  <text x="282" y="217" class="sub-logo-text">Oslo akuttmedisinske</text>
  <text x="282" y="240" class="sub-logo-text">studentforening</text>
</svg>
